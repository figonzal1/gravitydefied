plugins {
    id 'com.android.application'
}

android {
    namespace 'org.happysanta.gd'
    compileSdk 34

    defaultConfig {
        applicationId "org.happysanta.gd"
        minSdk 21
        targetSdk 28
        versionCode 29
        versionName "1.1.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // org.apache.http was removed from android.jar at API 23.
    // This legacy shim keeps it on the compile classpath so Phase 1 compiles without
    // touching the networking code. Phase 2 replaces it with HttpURLConnection.
    useLibrary 'org.apache.http.legacy'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
